<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-jeu Phishing – CyberQuests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* Barre de jeu */
    .gamebar { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
    .gamebar__inner { max-width: 1512px; margin: 0 auto; padding: 16px var(--page-x); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
    .gamebar__quit { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; color: var(--grey); font-weight: 500; font-size: 14px; }
    .gamebar__quit:hover { background: var(--bg); color: var(--ink); }
    .gamebar__mid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .steps { display: flex; gap: 6px; }
    .steps span { width: 40px; height: 6px; border-radius: 3px; background: var(--border); }
    .steps span.is-done { background: var(--indigo); }
    .gamebar__time { justify-self: end; display: inline-flex; align-items: center; gap: 8px; color: var(--grey); font-weight: 500; font-size: 14px; }

    .stage { max-width: 1512px; margin: 0 auto; padding: 40px var(--page-x) 48px; display: flex; flex-direction: column; gap: 24px; }
    .stage--center { align-items: center; }
    .center-col { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 24px; }
    .instructions { text-align: center; }
    .instructions h1 { font-size: 28px; }

    /* Faux mail */
    .mail { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); }
    .mail__head { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .mail__subject { font-size: 20px; font-weight: 700; }
    .mail__body { padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
    .mail__cta { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 8px; background: var(--blue); color: #fff; font-weight: 600; }
    .mail__cta:hover { filter: brightness(.95); }
    .mail__att { display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); text-align: left; }
    .mail__att:hover { border-color: var(--blue); }

    /* Indices surlignés */
    .hl { display: inline-flex; align-items: flex-start; gap: 6px; padding: 3px 8px; border-radius: 6px; background: var(--yellow); border: 1.5px solid var(--orange); }
    .hl--block { display: flex; width: 100%; }
    .num { width: 20px; height: 20px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .num--lg { width: 26px; height: 26px; font-size: 13px; }
    .tooltip { display: inline-block; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 500; }

    /* Choix */
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .choice { display: flex; flex-direction: column; gap: 8px; padding: 20px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; text-align: left; color: var(--indigo); }
    .choice:hover { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-light); }
    .choice strong { color: var(--ink); font-size: 16px; }
    .choice span { color: var(--grey); font-size: 14px; }

    .banner { display: flex; align-items: center; gap: 16px; padding: 20px 24px; border-radius: var(--radius); }
    .banner--warm { background: var(--orange-light); border: 1px solid var(--orange); }
    .banner--good { background: var(--green-light); border: 1px solid var(--green); }
    .banner__icon { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .explain { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .hint { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
    .reflexe { padding: 16px; border-radius: 10px; background: var(--green-light); border: 1px solid var(--green); }

    .qcard { width: 100%; max-width: 760px; padding: 32px; border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 20px; }
    .result-list .list-row { padding: 12px 0; }

    @media (max-width: 900px) {
      .gamebar__inner { grid-template-columns: 1fr auto; }
      .gamebar__time { display: none; }
      .gamebar__quit span { display: none; }
      .choices, .explain { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="gamebar">
    <div class="gamebar__inner">
      <a class="gamebar__quit" href="accueil.html" id="quit"><span data-icon="x"></span><span>Quitter (progression sauvegardée)</span></a>
      <div class="gamebar__mid">
        <strong id="game-title"></strong>
        <div class="steps" id="steps" aria-hidden="true"></div>
        <span class="small muted" id="step-label"></span>
      </div>
      <span class="gamebar__time"><span data-icon="clock"></span><span id="time-left"></span></span>
    </div>
  </header>

  <main id="stage" class="stage" aria-live="polite"></main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/db.js"></script>
  <script>
    boot(null, async user => {
      $$("[data-icon]").forEach(s => s.outerHTML = icon(s.dataset.icon, 16));

      const G = DATA.game;
      const N = G.situations.length;
      /* La partie en cours et les résultats sont enregistrés dans le navigateur */
      const gameKey = "cq_game_" + user.id;
      const saved = Store.get(gameKey, null);
      const state = saved && saved.index < N ? saved : { index: 0, step: "mail", results: [] };
      if (state.step === "resultat") state.step = "mail";
      let verifChoice = null;

      $("#game-title").textContent = G.title;

      function save() { Store.set(gameKey, state); }

      function updateBar() {
        const finished = state.step === "resultat";
        const current = finished ? N : state.index + 1;
        $("#steps").innerHTML = G.situations.map((_, i) => `<span class="${i < current ? "is-done" : ""}"></span>`).join("");
        $("#step-label").textContent = finished ? "Partie terminée" : `Situation ${current} sur ${N}`;
        const left = finished ? 0 : (N - state.index) * G.minutesPerSituation;
        $("#time-left").textContent = finished ? "Terminé" : `≈ ${left} min restantes`;
      }

      /* Rendu du faux mail ; annotated = indices surlignés et numérotés */
      function mailHtml(s, annotated) {
        const wrap = (html, hint, block) => annotated && hint
          ? `<span class="hl ${block ? "hl--block" : ""}"><span class="num">${hint}</span><span>${html}</span></span>` : html;
        const body = s.body.map(p => `<p style="${annotated && p.hint ? "width:100%" : ""}">${wrap(esc(p.text), p.hint, true)}</p>`).join("");
        let cta = "";
        if (s.cta) {
          const btn = `<button class="mail__cta" data-action="cta" title="${annotated ? "" : esc(s.cta.real)}" ${annotated ? "disabled" : ""}>${icon("link", 16)}${esc(s.cta.label)}</button>`;
          cta = annotated
            ? `<div class="row" style="flex-wrap:wrap">${wrap(btn, s.cta.hint)}<span class="tooltip">Adresse réelle : ${esc(s.cta.real)}</span></div>`
            : btn;
        }
        let att = "";
        if (s.attachment) {
          const a = `<button class="mail__att" data-action="attachment" ${annotated ? "disabled" : ""}>${icon("paperclip", 18)}<span><strong style="display:block">${esc(s.attachment.name)}</strong><span class="small muted">${s.attachment.size}</span></span></button>`;
          att = wrap(a, s.attachment.hint);
        }
        return `
          <article class="mail" aria-label="Mail reçu">
            <div class="mail__head">
              <h2 class="mail__subject">${esc(s.subject)}</h2>
              <div class="row">
                <span class="avatar" style="width:36px;height:36px;font-size:13px">${s.fromInitials}</span>
                <div><div style="font-weight:600">${esc(s.fromName)}</div><div class="small muted">${wrap("&lt;" + esc(s.fromAddr) + "&gt;", s.fromHint)}</div></div>
              </div>
              <div class="small muted">À : moi · ${esc(s.date)}</div>
            </div>
            <div class="mail__body">
              ${body}${att}${cta}
              <p>${wrap(nl2br(s.signature.text), s.signature.hint)}</p>
            </div>
          </article>`;
      }

      function hintsHtml(s) {
        return `
          ${s.hints.map((h, i) => `
            <div class="hint"><span class="num num--lg">${i + 1}</span>
              <div><strong style="display:block">${esc(h.title)}</strong><span class="small muted">${esc(h.desc)}</span></div></div>`).join("")}
          <div class="reflexe">
            <div class="row" style="gap:8px;color:var(--green);font-weight:600;margin-bottom:6px">${icon("shield", 18)} Le bon réflexe</div>
            <p class="small">${esc(s.reflexe)}</p>
          </div>`;
      }

      function choose(correct) {
        state.results[state.index] = { firstTry: correct, verif: null };
        state.step = correct ? "bravo" : "explication";
        save(); render();
      }

      const VIEWS = {
        mail(s) {
          return `
            <div class="stage stage--center" style="padding:0">
              <div class="center-col">
                <div class="instructions"><h1>Vous recevez ce mail. Que faites-vous ?</h1><p class="muted">Lisez-le comme vous le feriez au bureau, puis choisissez une action.</p></div>
                ${mailHtml(s, false)}
                <div class="choices">
                  ${s.choices.map((c, i) => `<button class="choice" data-choice="${i}">${icon(c.icon, 22)}<strong>${esc(c.label)}</strong><span>${esc(c.desc)}</span></button>`).join("")}
                </div>
              </div>
            </div>`;
        },
        bravo(s) {
          return `
            <div class="banner banner--good">
              <span class="banner__icon" style="color:var(--green)">${icon("check", 22)}</span>
              <div><strong style="font-size:18px">Bien vu, c'était bien un piège !</strong>
                <p class="muted">Vous avez eu le bon réflexe en signalant ce mail. Voici les indices qui le trahissaient.</p></div>
            </div>
            <div class="explain">
              <div class="stack" style="gap:12px"><span class="label-caps">Le mail, avec les indices surlignés</span>${mailHtml(s, true)}</div>
              <div class="stack" style="gap:12px"><span class="label-caps">Les indices que vous avez repérés</span>${hintsHtml(s)}</div>
            </div>
            <div class="row" style="justify-content:flex-end"><button class="btn btn--primary" data-next>Continuer ${icon("arrowRight", 18)}</button></div>`;
        },
        explication(s) {
          return `
            <div class="banner banner--warm">
              <span class="banner__icon" style="color:var(--orange)">${icon("heart", 22)}</span>
              <div><strong style="font-size:18px">Oups, c'était un piège… pas d'inquiétude, c'est fait pour apprendre !</strong>
                <p class="muted">Dans la vraie vie, cette action aurait pu donner accès à vos données. Voici les ${s.hints.length} indices qui pouvaient vous alerter.</p></div>
            </div>
            <div class="explain">
              <div class="stack" style="gap:12px"><span class="label-caps">Le mail, avec les indices surlignés</span>${mailHtml(s, true)}</div>
              <div class="stack" style="gap:12px"><span class="label-caps">Ce qu'il fallait repérer</span>${hintsHtml(s)}</div>
            </div>
            <div class="row" style="justify-content:flex-end"><button class="btn btn--primary" data-next>J'ai compris, continuer ${icon("arrowRight", 18)}</button></div>`;
        },
        verif(s) {
          const v = s.verif;
          const answered = verifChoice !== null;
          const ok = answered && verifChoice === v.correct;
          const last = state.index === N - 1;
          return `
            <div class="stage stage--center" style="padding:16px 0 0">
              <div class="card qcard">
                <span class="tag tag--indigo" style="align-self:flex-start;font-weight:600">Vérifions que c'est clair</span>
                <h1 style="font-size:24px">${esc(v.question)}</h1>
                <div class="stack" style="gap:12px" role="radiogroup">
                  ${v.options.map((o, i) => {
                    let cls = "";
                    if (answered && i === v.correct) cls = "is-correct";
                    else if (answered && i === verifChoice) cls = "is-wrong";
                    return `<button class="option ${cls}" data-opt="${i}" role="radio" aria-checked="${i === verifChoice}" ${answered ? "disabled" : ""}>
                      <span class="option__radio">${cls === "is-correct" ? icon("check", 14) : cls === "is-wrong" ? icon("x", 14) : ""}</span>
                      <span style="${cls === "is-correct" ? "font-weight:600" : ""}">${esc(o)}</span></button>`;
                  }).join("")}
                </div>
                ${answered ? `
                  <div class="alert ${ok ? "alert--success" : "alert--warning"}">
                    <span style="color:${ok ? "var(--green)" : "var(--orange)"}">${icon(ok ? "check" : "bulb", 20)}</span>
                    <div><strong style="color:${ok ? "var(--green)" : "var(--orange)"}">${ok ? "Exactement !" : "Pas tout à fait, la bonne réponse est surlignée."}</strong>
                    <p>${esc(v.explanation)}</p></div>
                  </div>
                  <div class="row" style="justify-content:flex-end"><button class="btn btn--primary" data-next>${last ? "Voir mon résultat" : "Situation suivante"} ${icon("arrowRight", 18)}</button></div>` : ""}
              </div>
            </div>`;
        },
        resultat() {
          const firstTry = state.results.filter(r => r && r.firstTry).length;
          const perfect = firstTry === N;
          return `
            <div class="stage stage--center" style="padding:16px 0 0">
              <div class="card qcard" style="text-align:center;align-items:center">
                <span class="icon-box ${perfect ? "icon-box--green" : ""}" style="width:64px;height:64px;border-radius:50%">${icon("shield", 32)}</span>
                <h1 style="font-size:28px">${perfect ? "Parcours réussi sans faute !" : "Mini-jeu terminé, bravo !"}</h1>
                <p class="muted" style="max-width:520px">Vous avez déjoué <strong style="color:var(--ink)">${firstTry} piège${firstTry > 1 ? "s" : ""} sur ${N}</strong> du premier coup. ${perfect ? "Aucun piège ne vous a échappé." : "Les autres sont maintenant compris : c'est ce qui compte."}</p>
                <div class="result-list" style="width:100%;text-align:left">
                  ${G.situations.map((s, i) => {
                    const r = state.results[i] || {};
                    return `<div class="list-row">
                      <span class="status-dot ${r.firstTry ? "icon-box--green" : "icon-box--orange"}">${icon(r.firstTry ? "check" : "bulb", 16)}</span>
                      <div class="grow"><div style="font-weight:600">${esc(s.subject)}</div><div class="small muted">${r.firstTry ? "Repéré du premier coup" : "Compris grâce à l'explication"}</div></div>
                      <span class="tag ${r.firstTry ? "tag--green" : "tag--orange"}">${r.firstTry ? "Déjoué" : "Compris"}</span></div>`;
                  }).join("")}
                </div>
                <div class="row" style="flex-wrap:wrap;justify-content:center">
                  <button class="btn btn--secondary" id="replay">${icon("rotate", 18)} Rejouer</button>
                  <a class="btn btn--primary" href="progression.html">Voir ma progression ${icon("arrowRight", 18)}</a>
                </div>
              </div>
            </div>`;
        }
      };

      function render() {
        updateBar();
        const s = G.situations[state.index];
        $("#stage").innerHTML = VIEWS[state.step](s);
        window.scrollTo({ top: 0 });

        $$("[data-choice]").forEach(b => b.addEventListener("click", () => choose(s.choices[+b.dataset.choice].correct)));
        $$('[data-action="cta"]:not([disabled]), [data-action="attachment"]:not([disabled])').forEach(b => b.addEventListener("click", () => choose(false)));
        $$("[data-opt]").forEach(b => b.addEventListener("click", () => {
          verifChoice = +b.dataset.opt;
          state.results[state.index].verif = verifChoice === s.verif.correct;
          save(); render();
        }));
        const next = $("[data-next]");
        if (next) next.addEventListener("click", () => {
          if (state.step === "bravo" || state.step === "explication") { state.step = "verif"; verifChoice = null; }
          else if (state.step === "verif") {
            verifChoice = null;
            if (state.index < N - 1) { state.index++; state.step = "mail"; }
            else finish();
          }
          if (state.step !== "resultat") save();
          render();
        });
        const replay = $("#replay");
        if (replay) replay.addEventListener("click", () => { Store.remove(gameKey); location.reload(); });
      }

      function finish() {
        state.step = "resultat";
        Store.remove(gameKey);
        Progress.addResult(user.id, { firstTry: state.results.filter(r => r && r.firstTry).length, total: N });
        Progress.complete(user.id, G.parcoursId);
      }

      if (saved && saved.index > 0 && saved.index < N) toast("Reprise là où vous vous étiez arrêté.");
      render();
    }, ["game"]);
  </script>
</body>
</html>
