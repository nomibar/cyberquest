<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration – CyberQuests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .admin { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
    .side { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .side h2 { font-size: 16px; padding: 8px 8px 12px; }
    .side a { display: block; padding: 10px 12px; border-radius: var(--radius-sm); }
    .side a:hover { background: var(--bg); }
    .side a.is-active { background: var(--indigo-light); }
    .side a.is-active strong { color: var(--indigo); }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    @media (max-width: 900px) { .admin { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header id="app-header"></header>
  <main>
    <div class="container">
      <div class="admin">
        <nav class="card side" aria-label="Parcours" id="side"></nav>
        <div class="stack" style="gap:20px" id="main"></div>
      </div>
    </div>
  </main>

  <!-- Modale de confirmation de suppression -->
  <div class="modal-overlay" id="delete-modal" hidden>
    <div class="modal modal--sm" role="alertdialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-desc">
      <div class="modal__body" style="padding-top:28px">
        <span class="icon-box icon-box--red" style="border-radius:50%"><span data-icon="warning"></span></span>
        <h2 class="modal__title" id="delete-title">Supprimer cette question ?</h2>
        <p class="muted" id="delete-desc"></p>
        <div class="alert alert--info" style="background:var(--bg)"><span data-icon="info"></span><span style="color:var(--ink)">Vous pouvez aussi la repasser en brouillon pour la masquer sans la perdre.</span></div>
      </div>
      <div class="modal__foot">
        <button class="btn btn--secondary" data-close>Annuler</button>
        <button class="btn btn--secondary" id="to-draft">Passer en brouillon</button>
        <button class="btn btn--danger" id="confirm-delete"><span data-icon="trash"></span> Supprimer</button>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    requireRole(["admin"]);
    renderHeader("admin");
    $$("[data-icon]").forEach(s => s.outerHTML = icon(s.dataset.icon, s.closest(".icon-box") ? 24 : 18));
    showFlash();

    let current = param("parcours") || "ia";
    if (!parcoursById(current)) current = "ia";
    const highlight = param("nouveau");
    let pendingDelete = null;

    function render() {
      const all = Questions.all();
      const p = parcoursById(current);
      const qs = all.filter(q => q.parcours === current);
      const published = qs.filter(q => q.statut === "publie").length;

      $("#side").innerHTML = `<h2>Parcours</h2>` + DATA.parcours.map(x => {
        const n = all.filter(q => q.parcours === x.id).length;
        return `<a href="admin.html?parcours=${x.id}" data-p="${x.id}" class="${x.id === current ? "is-active" : ""}" ${x.id === current ? 'aria-current="page"' : ""}>
          <strong style="display:block;font-weight:${x.id === current ? 600 : 500}">${x.name}</strong><span class="small muted">${n} question${n > 1 ? "s" : ""}</span></a>`;
      }).join("") + `<button class="link" style="padding:12px" id="new-parcours">${icon("plus", 16)} Nouveau parcours</button>`;

      $("#main").innerHTML = `
        <div class="page-header">
          <div>
            <div class="row"><h1 class="page-title" style="font-size:30px">${p.name}</h1>
              <span class="tag ${published ? "tag--green" : "tag--orange"}">${published ? "Publié" : "Non publié"}</span></div>
            <p class="page-subtitle" style="font-size:15px">Parcours visible par tous les employés · ${published} question${published > 1 ? "s" : ""} publiée${published > 1 ? "s" : ""} sur ${qs.length}</p>
          </div>
          <a class="btn btn--primary" href="admin-question.html?parcours=${current}">${icon("plus", 18)} Ajouter une question</a>
        </div>
        <section class="card card--flush table-wrap">
          <table class="table">
            <thead><tr><th>Question</th><th>Format</th><th>Statut</th><th style="text-align:right">Actions</th></tr></thead>
            <tbody>
              ${qs.length ? qs.map(q => `
                <tr class="${q.id === highlight ? "is-new" : ""}">
                  <td style="font-weight:600">${esc(q.titre)}</td>
                  <td class="muted"><span class="row" style="gap:8px">${icon(FORMAT_ICONS[q.format] || "file", 16)}${esc(q.format)}</span></td>
                  <td>${q.statut === "publie"
                    ? `<span class="tag tag--green">${q.id === highlight ? "Publié · nouveau" : "Publié"}</span>`
                    : '<span class="tag tag--orange">Brouillon</span>'}</td>
                  <td><div class="actions">
                    <a class="square-btn" href="admin-apercu.html?id=${q.id}" aria-label="Aperçu de « ${esc(q.titre)} »" title="Aperçu">${icon("eye", 16)}</a>
                    <a class="square-btn" href="admin-question.html?id=${q.id}" aria-label="Modifier « ${esc(q.titre)} »" title="Modifier">${icon("edit", 16)}</a>
                    <button class="square-btn square-btn--danger" data-delete="${q.id}" aria-label="Supprimer « ${esc(q.titre)} »" title="Supprimer">${icon("trash", 16)}</button>
                  </div></td>
                </tr>`).join("") : `<tr><td colspan="4" class="empty">Aucune question dans ce parcours pour le moment.</td></tr>`}
            </tbody>
          </table>
        </section>
        <div class="alert alert--info">${icon("info", 18)}<span>Données collectées pour ce parcours : avancement et notions ratées, rattachés à l'équipe. Aucune réponse détaillée n'est conservée.</span></div>`;

      $$("[data-delete]").forEach(b => b.addEventListener("click", () => askDelete(b.dataset.delete)));
      $("#new-parcours").addEventListener("click", () => toast("Création de parcours : prévue dans une prochaine version du prototype."));
    }

    /* ---- Suppression avec confirmation ---- */
    const modal = $("#delete-modal");
    function askDelete(id) {
      const q = Questions.get(id);
      pendingDelete = q;
      $("#delete-desc").textContent = `« ${q.titre} » sera retirée du parcours ${parcoursById(q.parcours).name}. Les employés ne la verront plus. Cette action est définitive.`;
      $("#to-draft").hidden = q.statut === "brouillon";
      openModal(modal);
    }
    $$("[data-close]", modal).forEach(b => b.addEventListener("click", () => closeModal(modal)));
    $("#confirm-delete").addEventListener("click", () => {
      const deleted = pendingDelete;
      Questions.remove(deleted.id);
      closeModal(modal); render();
      toast(`Question « ${esc(deleted.titre)} » supprimée.`, { label: "Annuler", onClick() { Questions.upsert(deleted); render(); toast("Suppression annulée."); } });
    });
    $("#to-draft").addEventListener("click", () => {
      Questions.upsert({ ...pendingDelete, statut: "brouillon" });
      closeModal(modal); render();
      toast("Question repassée en brouillon : elle n'est plus visible par les employés.");
    });

    render();
  </script>
</body>
</html>
